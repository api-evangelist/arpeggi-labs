aid: arpeggi-labs
name: Arpeggi Labs
description: >-
  Arpeggi Labs is the company behind Kits AI, a studio-quality AI music and
  audio platform for musicians, producers, and developers. Kits AI provides
  voice cloning and conversion, an AI singing generator with 100+ royalty-free
  artist voice models, vocal isolation, stem separation, AI mastering, and a
  voice-model blender, alongside an ethically sourced "Earn" program that pays
  vocalists to license digital clones of their voice. The Kits AI API exposes
  these capabilities as asynchronous inference jobs over a REST interface at
  arpeggi.io/api/kits/v1, authenticated with a bearer API key: create a voice
  conversion, vocal separation, stem split, or voice-blend job, then poll for
  the signed output file URLs. Arpeggi Labs is an a16z portfolio company; its
  earlier product was Arpeggi Studio, a web3 in-browser music creation platform.
